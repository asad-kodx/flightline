<!--

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->
<ion-header>
  <ion-toolbar>
    <ion-title>Add Control</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="!controlAdded">
    <!-- Organization select -->
    <ion-item>
      <ion-select
        interface="popover"
        placeholder="-- Select Organization --"
        (ionChange)="onOrgChange($event.detail.value)"
      >
        <ion-select-option
          *ngFor="let org of orgsList | async"
          [value]="org"
        >
          {{ org.name }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Site select -->
    <ion-item>
      <ion-select
        interface="popover"
        placeholder="-- Select Site --"
        (ionChange)="onSiteChange($event.detail.value)"
      >
        <ion-select-option
          *ngFor="let site of sitesList | async"
          [value]="site"
        >
          {{ site.siteName }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-button
      expand="block"
      color="success"
      (click)="assignControl()"
      [disabled]="!siteId || !orgId"
    >
      Add Control
    </ion-button>
  </div>

  <!-- Result / Error Card -->
  <ion-grid class="error-grid" *ngIf="controlAdded">
    <ion-row class="ion-justify-content-center ion-align-items-center error-grid-row">
      <ion-card [color]="hasErrors ? 'danger' : 'primary'">
        <ion-card-header>
          <ion-card-title>{{ messageTitle }}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <span [innerHTML]="messageBody"></span>
        </ion-card-content>
      </ion-card>
      <ion-button color="danger" size="large" (click)="onBackClick()">
        Back
      </ion-button>
    </ion-row>
  </ion-grid>
</ion-content>
